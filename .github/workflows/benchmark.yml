name: Benchmark infrastructure

on:
  push:
    branches: [master, main]
    paths: ['benchmarks/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/benchmark.yml']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional published release to install inside the fixture containers'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  benchmark-infrastructure:
    name: Benchmark infrastructure (no paid models)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
      OSMOGREP_FIXTURE_KEY: fixture-key
      RELEASE_VERSION: ${{ inputs.release_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-glibc-235
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - run: cargo build --locked
      - run: python -m pip install -r benchmarks/harbor/requirements.txt
      - run: python -m unittest benchmarks.harbor.test_adapter benchmarks.harbor.test_evaluation -v
      - name: Exercise native adapter and independent grading in Debian containers
        run: |
          cp target/debug/osmogrep benchmarks/harbor/tasks/adapter-contract/environment/osmogrep
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          config = json.loads(Path('benchmarks/harbor/contract.json').read_text())
          version = os.environ.get('RELEASE_VERSION')
          if version:
              assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'release_version must be a pinned semver'
              config['agents'][2]['kwargs'].update(skip_install=False, version=version)
          Path('/tmp/osmogrep-contract.json').write_text(json.dumps(config))
          PY
          harbor run -c /tmp/osmogrep-contract.json
          python benchmarks/harbor/report.py /tmp/osmogrep-harbor-contract/osmogrep-adapter-contract --check-contract --output /tmp/osmogrep-harbor-contract-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-infrastructure-evidence
          path: |
            /tmp/osmogrep-harbor-contract
            /tmp/osmogrep-harbor-contract-report.json
          if-no-files-found: warn
