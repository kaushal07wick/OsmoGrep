name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  npm-package:
    name: npm launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm test --prefix npm
      - run: npm pack ./npm --dry-run

  terminal-ui:
    name: TypeScript terminal UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terminal-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: terminal-ui/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- bundle/renderer.mjs

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - name: Check
        run: cargo check --locked

      - name: Test
        run: cargo test --locked

      - name: Harness integration contracts
        if: runner.os != 'Windows'
        run: |
          cargo build --locked
          python3 terminal-ui/scripts/provider-acceptance.py --binary target/debug/osmogrep --output /tmp/osmogrep-provider-acceptance.json
          python3 terminal-ui/scripts/harness-acceptance.py --binary target/debug/osmogrep --output /tmp/osmogrep-harness-acceptance.json
          python3 terminal-ui/scripts/team-acceptance.py --binary target/debug/osmogrep --output /tmp/osmogrep-team-acceptance.json
          python3 terminal-ui/scripts/lab-acceptance.py --binary target/debug/osmogrep --output /tmp/osmogrep-lab-acceptance.json
          python3 terminal-ui/scripts/long-run-acceptance.py --binary target/debug/osmogrep --output /tmp/osmogrep-long-run-acceptance.json

      - name: Device workspace contracts without OS downloads
        if: runner.os == 'macOS'
        run: python3 terminal-ui/scripts/device-workspace-acceptance.py
